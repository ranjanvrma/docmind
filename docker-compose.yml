# DocMind as a single container: the API serves the web UI on the same port.
#
#   cp .env.example .env    # then set DOCMIND_API_TOKEN (required: the image runs with
#                           # APP_ENV=production) and optionally LLM_API_KEY
#   docker compose up --build -d
#   open http://127.0.0.1:8000
#
# Data (uploads, index, registry, settings saved from the UI) persists in ./data.
# The port is bound to 127.0.0.1. To serve other machines, put a reverse proxy
# with TLS in front (see docs/DEPLOYMENT.md) rather than exposing it directly.
services:
  docmind:
    build: .
    image: docmind:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # The health check is defined in the Dockerfile (GET /api/health).
